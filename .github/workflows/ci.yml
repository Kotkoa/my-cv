name: CI — Build & Validate

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Jekyll
        run: |
          gem install jekyll bundler
          gem install jekyll-theme-minimal

      - name: Build site
        run: jekyll build

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress '_site/**/*.html'
          fail: false
          failIfEmpty: false

      - name: Upload artifact
        if: github.ref == 'refs/heads/gh-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/gh-pages' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
